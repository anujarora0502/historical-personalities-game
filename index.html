<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0908" />
    <meta name="description" content="Echoes of History — explore the Grand Museum, meet Mahatma Gandhi and Albert Einstein, recover lost memories and restore the Timeline of History." />
    <title>The Grand Museum — Echoes of History</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main id="app"></main>
    <section id="hud" aria-label="Game information">
      <div class="location-card">
        <span class="location-label" id="location-label">You are exploring</span>
        <strong id="room-name">Museum Grounds</strong>
        <span id="room-detail">Walk toward the entrance.</span>
      </div>
      <div class="crosshair" aria-hidden="true"></div>
      <aside class="controls-card">
        <span><kbd>WASD</kbd> Walk</span>
        <span><kbd>Space</kbd> Jump</span>
        <span><kbd>Drag</kbd> Look</span>
        <span><kbd>E</kbd> Interact</span>
        <span><kbd>J</kbd> Journal</span>
        <span><kbd>P</kbd> Photo</span>
        <span><kbd>M</kbd> Sound</span>
      </aside>
    </section>
    <div id="ui"></div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
