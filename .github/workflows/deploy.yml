name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Optional: add these as repository secrets to enable voice conversations.
          # Note: VITE_* values are embedded in the public JavaScript bundle.
          VITE_SARVAM_API_KEY: ${{ secrets.VITE_SARVAM_API_KEY }}
          VITE_SARVAM_ORG_ID: ${{ secrets.VITE_SARVAM_ORG_ID }}
          VITE_SARVAM_WORKSPACE_ID: ${{ secrets.VITE_SARVAM_WORKSPACE_ID }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
